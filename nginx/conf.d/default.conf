#-------------------------------------------------------------------
# 1. Host Virtual: portal.empresa.local (Servido directamente por Nginx)
#--------------------------------------------------------------------
server {
    listen 80;
    server_name portal.empresa.local;
    
    # Hardening perimetral básico (OWASP Top 10)
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Segregación de logs por Host Virtual
    access_log /var/log/nginx/portal_access.log;
    error_log  /var/log/nginx/portal_error.log warn;
}

#--------------------------------------------------------------------
# 2. Host Virtual: app-gestion.empresa.local (Proxy Inverso hacia Apache)
#--------------------------------------------------------------------
server {
    listen 80;
    server_name app-gestion.empresa.local;
    
    server_tokens off;

    # Endpoint restringido /privado/
    location /privado/ {
        if ($http_x_auth_token != "DAW2026") {
            return 403 "Acceso Denegado: Cabecera X-Auth-Token invalida o ausente.\n";
        }
        
        # Redirección interna hacia el servicio de Apache
        proxy_pass http://srv-apache-app:80/privado/;

        # INYECCIÓN DE CABECERAS PARA TRAZABILIDAD (RGPD / LOPDGDD)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Mitigación contra ataques de denegación de servicio
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Ruta raíz principal
    location / {
        # Resolución interna mediante el DNS embebido de Docker
        proxy_pass http://apache-app:80;


        # INYECCIÓN DE CABECERAS PARA TRAZABILIDAD (RGPD / LOPDGDD)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Mitigación contra ataques de denegación de servicio
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Segregación de logs para la aplicación de backend
    access_log /var/log/nginx/app_gestion_access.log;
    error_log  /var/log/nginx/app_gestion_error.log warn;
}